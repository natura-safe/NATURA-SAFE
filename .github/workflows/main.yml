.github/workflows/update-sipongi.ymlname: Update NATURA-SAFE data

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: natura-safe-data-update
  cancel-in-progress: false

jobs:
  update-hotspots:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl playwright
          playwright install --with-deps chromium

      - name: Update SiPongi hotspots
        run: python scripts/update_sipongi.py

      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hotspots.json hotspots-meta.json
          if git diff --cached --quiet; then
            echo 'No hotspot data changes.'
          else
            git commit -m 'chore(data): refresh SiPongi hotspot snapshot'
            git push
          fi
